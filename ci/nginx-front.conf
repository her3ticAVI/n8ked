server {
    listen 8080;

    add_header X-N8N-Origin "ci-lab-node" always;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Deliberately-leaky path -- tests the file-exposure detection.
    location = /.env {
        alias /usr/share/nginx/leaky/.env;
    }

    # Simulates an n8n instance whose /rest/variables endpoint is
    # unauthenticated and leaking secrets (n8n Variables are frequently
    # misused to store exactly this kind of thing in real deployments).
    # This is a controlled fixture -- NOT a reproduction of a real n8n
    # auth bypass -- its purpose is to feed n8ked.sh's unauthenticated-
    # exposure + secret-scan pipeline a realistic body so CI can assert
    # the scanner actually catches it.
    location = /rest/variables {
        default_type application/json;
        return 200 '{"data":{"api_key":"FAKEKEY1234567890ABCDEFGH","aws_key":"AKIAFAKE1234567890AB","database_url":"postgres://faketest:fakepass123@db.internal.lab:5432/appdb","slack_token":"xoxb-000000000000-000000000000-FAKEFAKEFAKEFAKEFAKEFAKE","github_token":"ghp_FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE","secret":"supersecretvalue123"}}';
    }

    # Simulates a live, registered production webhook, restricted to a
    # single HTTP method to mirror how a real n8n webhook node is
    # registered for exactly ONE configured method. For any other method,
    # respond with the SAME shape n8n itself uses for an unregistered
    # path/method combo -- HTTP 404 with "is not registered" in the body
    # -- rather than a bare 403 deny. n8ked.sh's own classifier treats 403
    # as AUTH-REQUIRED (a real, counted hit: "this path exists, just
    # protected"), which is correct tool behavior but doesn't match what
    # a genuinely unregistered method looks like against real n8n.
    location = /webhook/ci-test-hook {
        if ($request_method != GET) {
            default_type application/json;
            return 404 '{"code":404,"message":"The requested webhook is not registered."}';
        }
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
    }
}
